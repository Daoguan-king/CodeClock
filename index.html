<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<title>CodeClock</title>
<link rel="stylesheet" href="css/sidebar.css"/>
<style>
	@font-face { font-family: "CCJetBrainsMono"; src: url("fonts/JetBrainsMono-Regular.woff") format("woff"); font-weight: 400; font-style: normal; }
	@font-face { font-family: "CCJetBrainsMono"; src: url("fonts/JetBrainsMono-Bold.woff") format("woff"); font-weight: 700; font-style: normal; }
	@font-face { font-family: "CCFiraCode"; src: url("fonts/FiraCode-Regular.woff") format("woff"); font-weight: 400; font-style: normal; }
	@font-face { font-family: "CCUbuntuMono"; src: url("fonts/UbuntuMono-Regular.woff") format("woff"); font-weight: 400; font-style: normal; }
	@font-face { font-family: "CCNotoSansMono"; src: url("fonts/NotoSansMonoCJKsc-Regular.otf") format("opentype"); font-weight: 400; font-style: normal; }
	@font-face { font-family: "CCIBMPlexMono"; src: url("fonts/IBMPlexMono-Regular.woff") format("woff"); font-weight: 400; font-style: normal; }
	@font-face { font-family: "CCIBMPlexMono"; src: url("fonts/IBMPlexMono-Bold.woff") format("woff"); font-weight: 700; font-style: normal; }
	@font-face { font-family: "CCSourceCodePro"; src: url("fonts/SourceCodePro-Regular.woff") format("woff"); font-weight: 400; font-style: normal; }
	@font-face { font-family: "CCSourceCodePro"; src: url("fonts/SourceCodePro-Bold.woff") format("woff"); font-weight: 700; font-style: normal; }
	html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
	#wrap { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }
	#bounce { position: relative; }
	#bounce.bounce { animation: codeBounce .65s cubic-bezier(.36, .07, .19, .97); }
	@keyframes codeBounce {
		0% { transform: scale(1); }
		20% { transform: scale(1.05); }
		45% { transform: scale(.96); }
		65% { transform: scale(1.02); }
		85% { transform: scale(.998); }
		100% { transform: scale(1); }
	}
	#editor {
		background: var(--bg); color: var(--fg); border-radius: 10px; overflow: hidden;
		box-shadow: 0 12px 40px rgba(0, 0, 0, .38);
		transition: opacity .18s ease, transform .35s cubic-bezier(.22, .61, .36, 1), background-color .5s ease;
		user-select: none; -webkit-user-select: none;
	}
	#titlebar { display: flex; align-items: center; height: 36px; padding: 0 14px; background: var(--title); }
	.dot { width: 12px; height: 12px; border-radius: 50%; margin-right: 8px; }
	.dot.r { background: #ff5f57; }
	.dot.y { background: #febc2e; }
	.dot.g { background: #28c840; }
	#tabname { margin-left: 10px; font-size: 13px; color: var(--tabfg); opacity: .9; letter-spacing: .3px; white-space: nowrap; }
	#body { display: flex; align-items: stretch; }
	pre#code, #gutter { font-family: inherit; }
	#gutter {
		margin: 0; padding: 10px 12px 12px 0; text-align: right; background: var(--gutter);
		color: var(--gutterfg); opacity: .55; white-space: pre; user-select: none;
	}
	pre#code { margin: 0; padding: 10px 18px 12px 6px; background: var(--bg); white-space: pre; }
	.tok-com { color: var(--tok-com); font-style: italic; }
	.tok-key { color: var(--tok-key); font-weight: 600; }
	.tok-str { color: var(--tok-str); }
	.tok-num { color: var(--tok-num); }
	.tok-typ { color: var(--tok-typ); }
	.tok-var { color: var(--tok-var); }
	.tok-pun { color: var(--tok-pun); }
	.tok-fn { color: var(--tok-fn); }
	.tok-pp { color: var(--tok-pp); }
	.tok-shb { color: var(--tok-shb); }
	#editor.no-hl .tok-com, #editor.no-hl .tok-key, #editor.no-hl .tok-str,
	#editor.no-hl .tok-num, #editor.no-hl .tok-typ, #editor.no-hl .tok-var,
	#editor.no-hl .tok-pun, #editor.no-hl .tok-fn, #editor.no-hl .tok-pp,
	#editor.no-hl .tok-shb {
		color: var(--fg); font-weight: 400; font-style: normal;
	}
	.cursor {
		display: inline-block; width: .62em; height: 1.08em; background: var(--cursor);
		vertical-align: text-bottom; margin-left: 3px; animation: blink 1.1s steps(1) infinite;
	}
	@keyframes blink { 50% { opacity: 0; } }
	#editor ::selection { background: var(--sel); }
</style>
</head>
<body>
<div id="wrap">
	<div id="bounce">
		<div id="editor">
			<div id="titlebar"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span><span id="tabname">clock.js</span></div>
			<div id="body">
				<pre id="gutter"></pre>
				<pre id="code"></pre>
			</div>
		</div>
	</div>
</div>
<button id="sidebar-toggle" title="设置 / Settings">&#9881;</button>
<aside id="sidebar"></aside>
<div id="ctxmenu"></div>
<script src="js/themes.js"></script>
<script src="js/languages.js"></script>
<script src="js/settings.js"></script>
<script src="js/sidebar.js"></script>
<script src="js/main.js"></script>
</body>
</html>
